# Inline-secret metadata fixture for the validation CLI tests.
#
# `forums[0].secrets.adminPassword` holds a literal value instead of a
# Secret_Reference (`ssm:` / `secretsmanager:`). The value is an OBVIOUS
# placeholder, never a realistic secret. The loader must reject it at the field
# path WITHOUT echoing the value, which this fixture's test asserts.
version: 1
environment:
  name: community-test
  region: us-east-1
  availabilityZone: us-east-1a
  dnsMode: route53
  rootDomain: example.org
  adminEmail: ops@example.org
  sshAllowedCidrs:
    - 203.0.113.0/24
forums:
  - id: main
    engine: discourse
    subdomain: forum
    bundleId: medium_3_0
    senderAddress: noreply
    secrets:
      adminPassword: test-secret-value # inline secret: must be a Secret_Reference
      apiKey: ssm:/community-hub/community-test/main/api-key
