version: 1

environment:
  name: k-builders
  region: us-east-1
  availabilityZone: us-east-1a
  dnsMode: route53-existing
  hostedZoneId: Z0312538QMXTZXKV0SGK
  rootDomain: k-builders.net
  adminEmail: srinclan@arcamo.org
  sshAllowedCidrs: []
  # mailDomain defaults to rootDomain (k-builders.net); MAIL FROM becomes mail.k-builders.net
  # dmarcPolicy defaults to none; acmeStaging defaults to false (production Let's Encrypt)

forums:
  - id: hub
    engine: discourse
    subdomain: hub
    bundleId: medium_3_0
    senderAddress: noreply
    secrets:
      adminPassword: ssm:/community-hub/k-builders/hub/admin-password
      apiKey: ssm:/community-hub/k-builders/hub/api-key
    config:
      settings:
        title: 'The K Builders Community'
        default_locale: es
      theme:
        # Kiro brand palette (primary purple #7138cc, bright accents #9e61ff/#b080ff,
        # dark surface #211d25). mode:auto follows the visitor's OS light/dark setting.
        palette:
          name: 'Kiro'
          primary: '352f3d' # body text (Kiro light foreground)
          secondary: 'ffffff' # page background
          tertiary: '7138cc' # links & primary buttons (Kiro purple)
          quaternary: '9e61ff' # secondary accent (bright purple)
          highlight: 'b080ff' # highlight (light purple)
          headerBackground: '211d25' # dark Kiro surface for the header bar
          headerPrimary: 'ffffff' # header text/icons
          danger: 'e45735'
          success: '009900'
        mode: auto
